<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-key="app.title">ItemSeed — RPG 像素道具產生器</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="theme.css" />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-deep);
      color: var(--ink);
      font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      min-height: 100vh;
      /* 細微的網格紋路,加深「機器」感 */
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: -1px -1px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ---------- 標題 ---------- */
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      border-bottom: 1px dashed var(--line);
      padding-bottom: 24px;
      margin-bottom: 40px;
    }
    .header-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .version-badge {
      display: inline-flex;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      padding: 3px 8px;
      color: var(--ink-dim);
      background: var(--bg-panel-2);
      border: 1px solid var(--line);
      border-radius: 2px;
      letter-spacing: 0.5px;
      user-select: none;
      white-space: nowrap;
    }
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    @media (max-width: 540px) {
      .header-right {
        align-items: flex-start;
      }
    }
    #lang-select, #theme-select {
      font-size: 12px;
      padding: 4px 8px;
      width: auto;
    }
    .settings-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    h1 {
      font-family: 'VT323', monospace;
      font-size: 64px;
      line-height: 1;
      margin: 0;
      letter-spacing: 1px;
      color: var(--ink);
    }
    h1 .accent {
      color: var(--accent);
    }
    .tagline {
      color: var(--ink-dim);
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .tagline .blink {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--accent);
      vertical-align: -2px;
      margin-left: 4px;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ---------- 主要佈局 ---------- */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 32px;
      align-items: start;
    }
    @media (max-width: 800px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* ---------- 預覽區 ---------- */
    .preview-card {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 24px;
      position: relative;
    }
    .preview-card::before {
      /* 角落裝飾,模擬機械面板的螺絲/標記 */
      content: '';
      position: absolute;
      top: 8px; left: 8px;
      width: 6px; height: 6px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .preview-label {
      font-family: 'VT323', monospace;
      font-size: 22px;
      color: var(--accent);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .preview-frame {
      background:
        linear-gradient(135deg, var(--bg-frame-a) 25%, transparent 25%),
        linear-gradient(225deg, var(--bg-frame-a) 25%, transparent 25%),
        linear-gradient(45deg, var(--bg-frame-a) 25%, transparent 25%),
        linear-gradient(315deg, var(--bg-frame-a) 25%, var(--bg-frame-b) 25%);
      background-position: 8px 0, 8px 0, 0 0, 0 0;
      background-size: 16px 16px;
      background-color: var(--bg-frame-b);
      border: 1px solid var(--line);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
    }
    #preview-canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 384px;
      max-height: 384px;
    }
    .preview-info {
      margin-top: 12px;
      font-size: 11px;
      color: var(--ink-dim);
      display: flex;
      justify-content: space-between;
    }

    /* ---------- 控制面板 ---------- */
    .controls {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group label {
      font-family: 'VT323', monospace;
      font-size: 18px;
      color: var(--accent-2);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .seed-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"], select {
      background: var(--bg-panel-2);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ---------- 按鈕 ---------- */
    button {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 12px 16px;
      border: 1px solid var(--line);
      background: var(--bg-panel-2);
      color: var(--ink);
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.12s;
      position: relative;
    }
    button:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translate(-1px, -1px);
      box-shadow: 1px 1px 0 var(--line);
    }
    button:active {
      transform: translate(0, 0);
      box-shadow: none;
    }
    button.primary {
      background: var(--accent);
      color: var(--bg-deep);
      border-color: var(--accent);
    }
    button.primary:hover {
      background: var(--ink);
      color: var(--bg-deep);
      border-color: var(--ink);
    }
    button.icon-btn {
      width: 40px;
      flex-shrink: 0;
      padding: 10px;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }

    .asset-license-tag {
      font-size: 11px;
      line-height: 1.5;
      color: var(--ink-dim);
      background: var(--bg-panel-2);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 4px 8px;
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
      width: fit-content;
      max-width: 100%;
    }
    .asset-license-tag::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-2);
      flex-shrink: 0;
      margin-top: 5px;
    }

    /* ---------- 批次預覽 ---------- */
    .grid-section {
      margin-top: 48px;
    }
    .grid-section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: 1px dashed var(--line);
      padding-bottom: 8px;
    }
    .grid-section-header h2 {
      font-family: 'VT323', monospace;
      font-size: 28px;
      color: var(--ink);
      margin: 0;
      letter-spacing: 1px;
    }
    .grid-section-header h2 .accent {
      color: var(--accent-2);
    }
    .grid-section-header .hint {
      font-size: 11px;
      color: var(--ink-dim);
    }
    #grid-container {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
    }
    @media (max-width: 700px) {
      #grid-container { grid-template-columns: repeat(4, 1fr); }
    }
    .grid-cell {
      aspect-ratio: 1 / 1;
      background: var(--bg-cell);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s;
      padding: 8px;
    }
    .grid-cell:hover {
      border-color: var(--accent);
      transform: scale(1.06);
      z-index: 2;
    }
    .grid-cell canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ---------- 頁尾 ---------- */
    footer {
      margin-top: 48px;
      font-size: 11px;
      color: var(--ink-dim);
      text-align: center;
      border-top: 1px dashed var(--line);
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    footer a {
      color: var(--accent-2);
      text-decoration: none;
    }
    footer a:hover { color: var(--accent); }
    .footer-license {
      color: var(--ink-dim);
      font-size: 11px;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body data-theme="light">
  <div class="app">
    <header>
      <div class="header-title-wrap">
        <h1>Item<span class="accent">Seed</span></h1>
        <span class="version-badge">v1.0.0</span>
      </div>
      <div class="header-right">
        <div class="settings-row">
          <select id="lang-select" aria-label="Language">
            <option value="zh-Hant">繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
          <select id="theme-select" data-i18n-attr-aria-label="theme.label" aria-label="Theme">
            <option value="auto"  data-i18n-key="theme.option.auto">自動</option>
            <option value="light" data-i18n-key="theme.option.light">亮色</option>
            <option value="dark"  data-i18n-key="theme.option.dark">暗色</option>
          </select>
        </div>
        <div class="tagline">
          <span data-i18n-key="app.tagline">RPG 像素道具產生器</span> <span class="blink"></span>
        </div>
      </div>
    </header>

    <div class="main-grid">
      <!-- 左:主預覽 -->
      <section class="preview-card">
        <div class="preview-label" data-i18n-key="preview.label">// preview</div>
        <div class="preview-frame">
          <canvas id="preview-canvas" width="384" height="384"></canvas>
        </div>
        <div class="preview-info">
          <span data-i18n-key="preview.scale">scale: 12x</span>
          <span data-i18n-key="preview.format">format: png · transparent</span>
        </div>
      </section>

      <!-- 右:控制面板 -->
      <section class="controls">
        <div class="control-group">
          <label for="seed-input" data-i18n-key="seed.label">// seed</label>
          <div class="seed-row">
            <input
              type="text"
              id="seed-input"
              data-i18n-attr-placeholder="seed.placeholder"
              placeholder="輸入種子,或留空隨機產生"
              autocomplete="off"
              spellcheck="false"
            />
            <button id="reroll-seed-btn" class="icon-btn" data-i18n-attr-title="seed.reroll.title" title="隨機新種子">⟳</button>
          </div>
        </div>

        <div class="row-2">
          <div class="control-group">
            <label for="type-select" data-i18n-key="type.label">// type</label>
            <select id="type-select">
              <option value="any" data-i18n-key="type.option.any">任意 (any)</option>
              <option value="potion" data-i18n-key="type.option.potion">藥水 (potion)</option>
              <option value="sword" data-i18n-key="type.option.sword">劍 (sword)</option>
              <option value="spear" data-i18n-key="type.option.spear">長矛 (spear)</option>
              <option value="shield" data-i18n-key="type.option.shield">盾牌 (shield)</option>
              <option value="staff" data-i18n-key="type.option.staff">法杖 (staff)</option>
            </select>
          </div>

          <div class="control-group">
            <label for="size-select" data-i18n-key="size.label">// size</label>
            <select id="size-select">
              <option value="32">32 × 32</option>
              <option value="16">16 × 16</option>
            </select>
          </div>
        </div>

        <div class="action-group">
          <div class="button-row">
            <button id="generate-btn" class="primary" data-i18n-key="generate.button">▸ generate</button>
            <button id="download-btn" data-i18n-key="download.button">⇩ png</button>
          </div>
          <span class="asset-license-tag" data-i18n-key="studio.asset_license">產生物件授權：CC0 1.0（商業與個人專案皆可免費使用）</span>
        </div>

        <div style="font-size: 11px; color: var(--ink-dim); line-height: 1.6;" data-i18n-key="tip.text">
          提示:同樣的種子永遠產生同樣的圖示。下方批次預覽中,點任何一張圖示即可載入。
        </div>
      </section>
    </div>

    <!-- 批次預覽 -->
    <section class="grid-section">
      <div class="grid-section-header">
        <h2><span data-i18n-key="batch.heading.before">batch</span><span class="accent">_</span><span data-i18n-key="batch.heading.after">preview</span></h2>
        <div class="hint" data-i18n-key="batch.hint">點任一格載入該種子</div>
      </div>
      <div id="grid-container"></div>
    </section>

    <footer>
      <div>
        <span>ItemSeed</span>  ·  <span data-i18n-key="footer.inspired">Inspired by</span>
        <a href="https://bmaczero.itch.io/icon-machine" target="_blank" rel="noopener">Brian MacIntosh's Icon Machine</a>  ·  <a href="https://github.com/ochowei/itemseed" target="_blank" rel="noopener" data-i18n-key="footer.source">Source on GitHub</a>
      </div>
      <div class="footer-license" data-i18n-key="footer.license">程式碼：MIT · 產生物件：CC0 1.0</div>
    </footer>
  </div>

  <script src="theme.js"></script>
  <script src="random.js"></script>
  <script src="palette.js"></script>
  <script src="pixel-utils.js"></script>
  <script src="potion.js"></script>
  <script src="sword.js"></script>
  <script src="spear.js"></script>
  <script src="shield.js"></script>
  <script src="staff.js"></script>
  <script src="i18n/zh-Hant.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n/ja.js"></script>
  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
